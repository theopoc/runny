name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5

      - name: Validate recovery release
        id: recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RECOVERY_TAG" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RECOVERY_TAG}" >/dev/null
          release="$(gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets)"

          if [[ "$(jq -r '.tagName' <<<"$release")" != "$RECOVERY_TAG" ]]; then
            echo "GitHub Release does not match tag: $RECOVERY_TAG" >&2
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<<"$release")" == "true" ]]; then
            echo "Recovery refuses draft release: $RECOVERY_TAG" >&2
            exit 1
          fi
          if [[ "$(jq '.assets | length' <<<"$release")" != "0" ]]; then
            echo "Recovery refuses release with existing assets; inspect partial publication manually: $RECOVERY_TAG" >&2
            jq -r '.assets[].name' <<<"$release" >&2
            exit 1
          fi

          echo "tag=$RECOVERY_TAG" >>"$GITHUB_OUTPUT"

      - name: Check out release tag
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag_name || steps.recovery.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up QEMU
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release artifacts
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
