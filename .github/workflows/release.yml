name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release PR
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@v4

      - name: Validate recovery release
        id: recovery
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RECOVERY_TAG" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RECOVERY_TAG}" >/dev/null
          release="$(gh release view "$RECOVERY_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets)"

          if [[ "$(jq -r '.tagName' <<<"$release")" != "$RECOVERY_TAG" ]]; then
            echo "GitHub Release does not match tag: $RECOVERY_TAG" >&2
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' <<<"$release")" == "true" ]]; then
            echo "Recovery refuses draft release: $RECOVERY_TAG" >&2
            exit 1
          fi
          if [[ "$(jq '.assets | length' <<<"$release")" != "0" ]]; then
            echo "Recovery refuses release with existing assets; inspect partial publication manually: $RECOVERY_TAG" >&2
            jq -r '.assets[].name' <<<"$release" >&2
            exit 1
          fi

          echo "tag=$RECOVERY_TAG" >>"$GITHUB_OUTPUT"

      - name: Check out release tag
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name || steps.recovery.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Publish release artifacts
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.tag != '' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
