name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './dist/*'))"
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/runny
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: check
      - name: Build Docker image
        env:
          VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --build-arg VERSION="$VERSION" -t runny:ci .
      - name: Smoke-test Docker version
        env:
          VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(docker run --rm runny:ci --version)" = "runny $VERSION"
      - name: Smoke-test Docker shell environment
        run: |
          fixture="$(mktemp -d)"
          mkdir "$fixture/test"
          printf 'export HELLO=world\n' > "$fixture/.envrc"
          cat > "$fixture/.zshrc" <<'ZSHRC'
          alias runny_alias_probe='echo "alias-from-zshrc HELLO=$HELLO"'
          ZSHRC
          docker run --rm \
            -v "$fixture:/workspace" \
            -v "$fixture/.zshrc:/home/runny/.zshrc:ro" \
            -w /workspace \
            --entrypoint sh \
            runny:ci \
            -ec "
              test -z \"\${SHELL:-}\"
              grep -q '^runny:.*:/bin/zsh\$' /etc/passwd
              command -v bash
              command -v zsh
              command -v direnv
              direnv allow .
              direnv exec test zsh -ic runny_alias_probe | grep -Fx 'alias-from-zshrc HELLO=world'
            "

  notify:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Report missing Telegram secrets
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '' }}
        run: echo "::warning::Telegram secrets unavailable; notification skipped"
      - name: Send Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ${{ needs.test.result == 'success' && '✅' || '❌' }} <b>CI ${{ needs.test.result }}</b>

            <b>Repository:</b> <code>${{ github.repository }}</code>
            <b>Branch:</b> <code>${{ github.head_ref || github.ref_name }}</code>
            <b>Event:</b> ${{ github.event_name }}
            <b>Commit:</b> <code>${{ github.event.pull_request.head.sha || github.sha }}</code>
            <b>Author:</b> ${{ github.actor }}
            <b>Test:</b> ${{ needs.test.result }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow run</a>
