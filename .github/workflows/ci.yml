name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './dist/*'))"
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Build and smoke-test native binary
        env:
          VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          go build -trimpath \
            -ldflags="-s -w -X github.com/theopoc/runny/internal/app.Version=$VERSION" \
            -o "$RUNNER_TEMP/runny" ./cmd/runny
          test "$("$RUNNER_TEMP/runny" --version)" = "runny $VERSION"
      - run: shellcheck scripts/*.sh
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          args: check

  notify:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Report missing Telegram secrets
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '' }}
        run: echo "::warning::Telegram secrets unavailable; notification skipped"
      - name: Send Telegram notification
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        uses: appleboy/telegram-action@390cf7345777cd821dba28c72f436a78bce19cc5 # master
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ${{ needs.test.result == 'success' && '✅' || '❌' }} <b>CI ${{ needs.test.result }}</b>

            <b>Repository:</b> <code>${{ github.repository }}</code>
            <b>Branch:</b> <code>${{ github.head_ref || github.ref_name }}</code>
            <b>Event:</b> ${{ github.event_name }}
            <b>Commit:</b> <code>${{ github.event.pull_request.head.sha || github.sha }}</code>
            <b>Author:</b> ${{ github.actor }}
            <b>Test:</b> ${{ needs.test.result }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow run</a>
