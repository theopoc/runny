version: 2

project_name: runny

before:
  hooks:
    - go mod tidy

builds:
  - id: runny
    main: ./cmd/runny
    binary: runny
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/theopoc/runny/internal/app.Version={{.Version}}

archives:
  - id: runny
    ids: [runny]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  mode: keep-existing

homebrew_casks:
  - name: runny
    ids: [runny]
    repository:
      owner: theopoc
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/theopoc/runny
    description: Run shell commands across selected child directories from a TUI
    license: MIT
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    binaries:
      - runny
    caveats: |
      To trust the tap before install:
        brew tap theopoc/tap
        brew trust --tap theopoc/tap

dockers_v2:
  - id: runny
    ids: [runny]
    images:
      - ghcr.io/theopoc/runny
    tags:
      - "v{{ .Version }}"
      - latest
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Run shell commands across selected child directories from a TUI
      org.opencontainers.image.source: https://github.com/theopoc/runny
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.source: https://github.com/theopoc/runny
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
