<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runny — prototype TUI</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #11131a;
      --terminal: #20232d;
      --surface: #282c38;
      --surface-2: #303543;
      --text: #e8e7ee;
      --muted: #9ea3b3;
      --faint: #696f80;
      --accent: #b9a5ff;
      --focus: #71a7f8;
      --ok: #5bd99a;
      --warn: #f0c96e;
      --danger: #ff7185;
      --border: #697184;
      --shadow: rgba(0, 0, 0, .48);
      font-family: "Berkeley Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(113, 167, 248, .10), transparent 31rem),
        radial-gradient(circle at 85% 82%, rgba(185, 165, 255, .09), transparent 28rem),
        var(--page);
      color: var(--text);
    }

    button { font: inherit; }

    .prototype-note {
      position: fixed;
      top: 14px;
      left: 50%;
      z-index: 20;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .prototype-note strong { color: var(--warn); }

    #stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 44px 24px 108px;
    }

    .terminal {
      width: min(120ch, calc(100vw - 48px));
      height: min(760px, calc(100vh - 152px));
      min-height: 500px;
      display: grid;
      overflow: hidden;
      background: var(--terminal);
      border: 1px solid #3b4050;
      border-radius: 10px;
      box-shadow: 0 28px 80px var(--shadow), inset 0 1px rgba(255,255,255,.04);
      font-size: 14px;
      line-height: 1.35;
    }

    #stage[data-size="80"] .terminal { width: min(80ch, calc(100vw - 32px)); }
    #stage[data-size="60"] .terminal { width: min(60ch, calc(100vw - 24px)); }

    .mono {
      --accent: #fff;
      --focus: #fff;
      --ok: #fff;
      --warn: #fff;
      --danger: #fff;
      --border: #aaa;
    }

    .mono .selected,
    .mono .cursor { background: transparent !important; }
    .mono .cursor { outline: 1px solid #fff; outline-offset: -1px; }
    .mono .status { color: #fff !important; }

    .topline,
    .statusline,
    .footer {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      white-space: nowrap;
    }

    .topline { padding: 8px 12px; background: #1a1d26; }
    .brand { color: var(--accent); font-weight: 800; }
    .meta { color: var(--muted); }
    .meta strong { color: var(--text); font-weight: 600; }
    .grow { flex: 1; }

    .commandline {
      min-width: 0;
      padding: 7px 12px;
      overflow: hidden;
      border-block: 1px solid #383d4c;
      color: var(--text);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .commandline .prompt { color: var(--accent); font-weight: 700; }
    .commandline .scope { float: right; color: var(--muted); }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 7px 10px;
      border-bottom: 1px solid #3a3f4e;
      color: var(--muted);
      font-weight: 700;
    }
    .panel-title .focused { color: var(--focus); }
    .panel-title .count { margin-left: auto; color: var(--faint); font-weight: 400; }

    .rows { overflow: hidden; padding: 4px 6px; }
    .row {
      min-height: 28px;
      display: grid;
      grid-template-columns: 2ch 4ch 1fr 12ch 7ch;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      cursor: default;
      border-radius: 3px;
    }
    .row:hover { background: rgba(255,255,255,.04); }
    .row.cursor { background: rgba(113, 167, 248, .20); }
    .row.selected .check { color: var(--accent); font-weight: 800; }
    .row .pointer { color: var(--focus); font-weight: 800; }
    .row .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .time { text-align: right; color: var(--faint); }
    .indent-1 .name { padding-left: 2ch; }
    .status { font-weight: 700; }
    .status.run { color: var(--warn); }
    .status.ok { color: var(--ok); }
    .status.fail { color: var(--danger); }
    .status.queue { color: var(--focus); }
    .status.idle { color: var(--muted); }

    .log-lines {
      min-height: 0;
      overflow: hidden;
      padding: 8px 10px;
      color: #cfd2dc;
    }
    .log-line { display: grid; grid-template-columns: 8ch 1fr; gap: 1ch; min-height: 22px; }
    .log-line .line-no { color: var(--faint); text-align: right; }
    .log-line.error .text { color: var(--danger); font-weight: 700; }
    .log-line.ok .text { color: var(--ok); }

    .statusline {
      padding: 5px 10px;
      border-top: 1px solid #3a3f4e;
      color: var(--muted);
    }
    .statusline .alert { color: var(--danger); font-weight: 700; }
    .statusline .running { color: var(--warn); }

    .footer {
      min-height: 32px;
      padding: 6px 10px;
      background: #1a1d26;
      color: var(--muted);
      overflow: hidden;
    }
    kbd { color: var(--accent); font: inherit; font-weight: 800; }

    /* A — balanced operator split. */
    .variant-a { grid-template-rows: auto auto 1fr auto auto; }
    .variant-a .workspace { min-height: 0; display: grid; grid-template-columns: 42fr 58fr; }
    .variant-a .pane { min-width: 0; min-height: 0; border-right: 1px solid #414756; }
    .variant-a .pane:last-child { border-right: 0; }
    .variant-a .output-pane { display: grid; grid-template-rows: auto 1fr; }

    /* B — logs first, targets become compact run queue. */
    .variant-b { grid-template-rows: auto 1fr auto auto; }
    .variant-b .topline { border-bottom: 2px solid var(--danger); }
    .variant-b .workspace { min-height: 0; display: grid; grid-template-columns: 1fr 28ch; }
    .variant-b .event-stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
    .variant-b .tabs { display: flex; gap: 3px; padding: 6px 8px 0; border-bottom: 1px solid #3a3f4e; }
    .variant-b .tab { padding: 5px 9px; color: var(--muted); }
    .variant-b .tab.active { color: var(--text); background: var(--surface-2); border-radius: 4px 4px 0 0; }
    .variant-b .event-line {
      display: grid;
      grid-template-columns: 8ch 12ch 1fr;
      gap: 1ch;
      min-height: 25px;
      align-items: center;
      padding: 2px 10px;
    }
    .variant-b .event-line .clock { color: var(--faint); }
    .variant-b .event-line .target { color: var(--focus); }
    .variant-b .event-line.error { background: rgba(255,113,133,.08); }
    .variant-b .run-queue { min-width: 0; border-left: 1px solid #414756; background: #242833; }
    .variant-b .queue-item { padding: 8px 9px; border-bottom: 1px solid #353a48; }
    .variant-b .queue-item.cursor { border-left: 3px solid var(--focus); background: rgba(113,167,248,.10); }
    .variant-b .queue-name { display: flex; justify-content: space-between; gap: 6px; }
    .variant-b .queue-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .variant-b .commandline { border-bottom: 0; border-top: 1px solid #383d4c; }

    /* C — table first, output drawer. */
    .variant-c { grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
    .variant-c .table-stage { min-height: 0; display: grid; grid-template-rows: auto 1fr; }
    .variant-c .table-head,
    .variant-c .table-row {
      display: grid;
      grid-template-columns: 3ch 1fr 12ch 9ch 9ch 8ch;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
    }
    .variant-c .table-head { color: var(--muted); border-bottom: 1px solid #3a3f4e; }
    .variant-c .table-row { min-height: 30px; }
    .variant-c .table-row.cursor { background: rgba(113,167,248,.18); outline: 1px solid var(--focus); outline-offset: -1px; }
    .variant-c .table-row .right { text-align: right; }
    .variant-c .drawer {
      height: 155px;
      display: grid;
      grid-template-rows: auto 1fr;
      border-top: 1px solid var(--focus);
      background: #1d2029;
    }
    .variant-c .drawer .log-lines { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }

    .prototype-switcher {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 40;
      width: min(940px, calc(100vw - 24px));
      display: grid;
      grid-template-columns: auto minmax(190px, 1fr) auto auto auto;
      align-items: center;
      gap: 8px;
      padding: 8px;
      transform: translateX(-50%);
      border: 1px solid #545b6d;
      border-radius: 14px;
      background: rgba(23, 26, 35, .96);
      box-shadow: 0 15px 45px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
    }
    .switch-button,
    .segmented button {
      border: 1px solid #555c6e;
      border-radius: 8px;
      background: #2a2f3b;
      color: var(--text);
      padding: 7px 10px;
      cursor: pointer;
    }
    .switch-button:hover,
    .segmented button:hover { border-color: var(--accent); }
    .variant-label { min-width: 0; text-align: center; }
    .variant-label strong { color: var(--accent); }
    .variant-state { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .segmented { display: flex; }
    .segmented button { border-radius: 0; border-right: 0; }
    .segmented button:first-child { border-radius: 8px 0 0 8px; }
    .segmented button:last-child { border-radius: 0 8px 8px 0; border-right: 1px solid #555c6e; }
    .segmented button.active { background: var(--accent); color: #171923; border-color: var(--accent); }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      background: rgba(8, 10, 14, .72);
    }
    .modal {
      width: min(58ch, calc(100% - 28px));
      padding: 16px;
      border: 1px solid var(--danger);
      border-radius: 5px;
      background: #242832;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }
    .modal h2 { margin: 0 0 10px; color: var(--danger); font-size: 16px; }
    .modal p { color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .modal-actions button { padding: 6px 10px; color: var(--text); background: #303543; border: 1px solid #596174; border-radius: 4px; }
    .modal-actions .danger { background: var(--danger); color: #1a1c24; border-color: var(--danger); font-weight: 800; }

    .help-grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px 14px; }

    #stage[data-size="80"] .terminal { font-size: 13px; }
    #stage[data-size="80"] .variant-a .workspace { grid-template-columns: 1fr; }
    #stage[data-size="80"] .variant-a .output-pane { display: none; }
    #stage[data-size="80"] .variant-a.focus-logs .tasks-pane { display: none; }
    #stage[data-size="80"] .variant-a.focus-logs .output-pane { display: grid; }
    #stage[data-size="80"] .variant-b .workspace { grid-template-columns: 1fr 22ch; }
    #stage[data-size="80"] .variant-c .table-head,
    #stage[data-size="80"] .variant-c .table-row { grid-template-columns: 3ch 1fr 10ch 8ch; }
    #stage[data-size="80"] .variant-c .hide-80 { display: none; }

    #stage[data-size="60"] .terminal { font-size: 12px; min-height: 480px; }
    #stage[data-size="60"] .topline .optional,
    #stage[data-size="60"] .commandline .scope,
    #stage[data-size="60"] .footer .optional { display: none; }
    #stage[data-size="60"] .variant-a .workspace,
    #stage[data-size="60"] .variant-b .workspace { grid-template-columns: 1fr; }
    #stage[data-size="60"] .variant-a .output-pane,
    #stage[data-size="60"] .variant-b .run-queue { display: none; }
    #stage[data-size="60"] .variant-a.focus-logs .tasks-pane { display: none; }
    #stage[data-size="60"] .variant-a.focus-logs .output-pane { display: grid; }
    #stage[data-size="60"] .variant-b.focus-tasks .event-stage { display: none; }
    #stage[data-size="60"] .variant-b.focus-tasks .run-queue { display: block; border-left: 0; }
    #stage[data-size="60"] .variant-c .table-head,
    #stage[data-size="60"] .variant-c .table-row { grid-template-columns: 3ch 1fr 10ch; }
    #stage[data-size="60"] .variant-c .hide-60 { display: none; }
    #stage[data-size="60"] .variant-c .drawer { height: 140px; }
    #stage[data-size="60"] .variant-c .drawer .log-lines { grid-template-columns: 1fr; }
    #stage[data-size="60"] .row { grid-template-columns: 2ch 4ch 1fr 11ch; }
    #stage[data-size="60"] .row .time { display: none; }

    @media (max-width: 760px) {
      #stage { padding-inline: 8px; }
      .prototype-switcher { grid-template-columns: auto 1fr auto; }
      .prototype-switcher .segmented,
      .prototype-switcher > .switch-button:last-child { display: none; }
      .prototype-note { max-width: calc(100vw - 20px); overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
</head>
<body>
  <div class="prototype-note"><strong>PROTOTYPE JETABLE</strong> · données fictives · aucune commande exécutée</div>
  <main id="stage" data-size="wide"></main>

  <nav class="prototype-switcher" aria-label="Variantes du prototype">
    <button class="switch-button" id="previous" aria-label="Variante précédente">←</button>
    <div class="variant-label">
      <div id="variant-title"></div>
      <div class="variant-state" id="state-readout"></div>
    </div>
    <button class="switch-button" id="next" aria-label="Variante suivante">→</button>
    <div class="segmented" aria-label="Largeur simulée">
      <button data-size="wide">120</button>
      <button data-size="80">80</button>
      <button data-size="60">60</button>
    </div>
    <button class="switch-button" id="mono">Mono</button>
  </nav>

  <script>
    // Three variants of Runny's TUI, switchable via ?variant= on this prototype-only route.
    const variants = [
      { key: 'A', name: 'Split opérateur' },
      { key: 'B', name: 'Console incidents' },
      { key: 'C', name: 'Table + tiroir' },
    ];

    const targets = [
      { name: 'apps', depth: 0, status: 'run', label: 'RUN', time: '00:12', selected: true },
      { name: 'api', depth: 1, status: 'run', label: 'RUN', time: '00:12', selected: true },
      { name: 'web', depth: 1, status: 'ok', label: 'OK', time: '00:08', selected: true },
      { name: 'worker', depth: 1, status: 'fail', label: 'FAIL', time: '00:03', selected: true },
      { name: 'docs space', depth: 0, status: 'idle', label: 'IDLE', time: '—', selected: false },
      { name: 'packages', depth: 0, status: 'queue', label: 'QUEUE', time: '—', selected: true },
      { name: 'ui', depth: 1, status: 'queue', label: 'QUEUE', time: '—', selected: true },
      { name: 'émoji-界', depth: 1, status: 'idle', label: 'IDLE', time: '—', selected: false },
      { name: 'services/auth', depth: 0, status: 'ok', label: 'OK', time: '00:07', selected: false },
      { name: 'services/billing-fail', depth: 0, status: 'fail', label: 'FAIL', time: '00:04', selected: true },
    ];

    const logs = [
      ['001', 'pnpm test'],
      ['002', 'scope: apps/api'],
      ['003', 'RUN  src/routes.test.ts'],
      ['004', 'PASS src/health.test.ts', 'ok'],
      ['005', 'PASS src/auth.test.ts', 'ok'],
      ['006', 'connecting to postgres...'],
      ['007', 'Error: connection refused 10.0.0.12:5432', 'error'],
      ['008', 'exit status 1', 'error'],
      ['009', 'retry available: R'],
    ];

    const state = {
      variant: new URLSearchParams(location.search).get('variant') || 'A',
      size: new URLSearchParams(location.search).get('size') || 'wide',
      cursor: 1,
      focus: 'tasks',
      follow: true,
      mono: new URLSearchParams(location.search).get('mono') === '1',
      modal: null,
    };

    function selectedCount() { return targets.filter(target => target.selected).length; }
    function currentTarget() { return targets[state.cursor]; }

    function updateURL() {
      const url = new URL(location.href);
      url.searchParams.set('variant', state.variant);
      url.searchParams.set('size', state.size);
      if (state.mono) url.searchParams.set('mono', '1'); else url.searchParams.delete('mono');
      history.replaceState({}, '', url);
    }

    function targetRows() {
      return targets.map((target, index) => `
        <div class="row ${target.selected ? 'selected' : ''} ${state.cursor === index ? 'cursor' : ''} indent-${target.depth}" data-row="${index}">
          <span class="pointer">${state.cursor === index ? '›' : ''}</span>
          <span class="check">${target.selected ? '[x]' : '[ ]'}</span>
          <span class="name">${target.depth ? '└─ ' : target.name === 'apps' || target.name === 'packages' ? '▾ ' : ''}${target.name}</span>
          <span class="status ${target.status}">${target.label}</span>
          <span class="time">${target.time}</span>
        </div>`).join('');
    }

    function logLines() {
      return logs.map(([line, text, kind = '']) => `
        <div class="log-line ${kind}"><span class="line-no">${line}</span><span class="text">${text}</span></div>`).join('');
    }

    function topLine(extra = '') {
      return `<header class="topline">
        <span class="brand">runny</span>
        <span class="meta">parallel×<strong>4</strong></span>
        <span class="meta optional"><strong>${selectedCount()}</strong> selected</span>
        <span class="meta"><strong>1</strong> run · <strong>2</strong> queue · <strong>2</strong> fail</span>
        <span class="grow"></span>${extra}
      </header>`;
    }

    function commandLine() {
      return `<div class="commandline"><span class="prompt">command ›</span> pnpm test <span class="scope">scope ${selectedCount()} targets · workers 4</span></div>`;
    }

    function statusLine() {
      return `<div class="statusline"><span class="running">● 1 running</span><span>◌ 2 queued</span><span>✓ 2 ok</span><span class="alert">✕ 2 failed</span><span class="grow"></span><span>follow:${state.follow ? 'on' : 'off'}</span></div>`;
    }

    function footer(mode = 'tasks') {
      const hints = mode === 'logs'
        ? '<kbd>f</kbd> follow · <kbd>PgUp/PgDn</kbd> scroll · <kbd>Tab</kbd> tasks · <kbd>?</kbd> help'
        : '<kbd>space</kbd> select · <kbd>/</kbd> filter · <kbd>x</kbd> cancel · <kbd>Tab</kbd> output · <kbd>?</kbd> help';
      return `<footer class="footer">${hints}<span class="grow"></span><span class="optional"><kbd>q</kbd> quit</span></footer>`;
    }

    function VariantA() {
      return `<section class="terminal variant-a focus-${state.focus}">
        ${topLine(`<span class="meta">${state.focus.toUpperCase()} — FOCUSED</span>`)}
        ${commandLine()}
        <div class="workspace">
          <section class="pane tasks-pane">
            <div class="panel-title"><span class="${state.focus === 'tasks' ? 'focused' : ''}">TASKS${state.focus === 'tasks' ? ' — FOCUSED' : ''}</span><span class="count">10 visible · ${selectedCount()} selected</span></div>
            <div class="rows">${targetRows()}</div>
          </section>
          <section class="pane output-pane">
            <div class="panel-title"><span class="${state.focus === 'logs' ? 'focused' : ''}">OUTPUT${state.focus === 'logs' ? ' — FOCUSED' : ''}</span> · <strong>${currentTarget().name}</strong><span class="status ${currentTarget().status}">[${currentTarget().label}]</span><span class="count">follow:${state.follow ? 'on' : 'off'} · 9 lines</span></div>
            <div class="log-lines">${logLines()}</div>
          </section>
        </div>
        ${statusLine()}
        ${footer(state.focus)}
        ${overlay()}
      </section>`;
    }

    function VariantB() {
      const events = [
        ['14:32:08', 'api', 'PASS health.test.ts'],
        ['14:32:09', 'web', 'completed in 8.1s'],
        ['14:32:10', 'worker', 'connection refused', 'error'],
        ['14:32:10', 'worker', 'exit status 1', 'error'],
        ['14:32:11', 'api', 'waiting for postgres'],
        ['14:32:12', 'billing-fail', 'exit status 7', 'error'],
        ['14:32:12', 'ui', 'queued · worker slot 4'],
      ];
      return `<section class="terminal variant-b focus-${state.focus}">
        ${topLine('<span class="status fail">INCIDENT · 2 FAIL</span>')}
        <div class="workspace">
          <section class="event-stage">
            <div class="tabs"><span class="tab active">All events</span><span class="tab">worker</span><span class="tab">billing-fail</span><span class="grow"></span><span class="tab">follow:${state.follow ? 'on' : 'off'}</span></div>
            <div class="log-lines">${events.map(([clock, target, text, kind = '']) => `<div class="event-line ${kind}"><span class="clock">${clock}</span><span class="target">${target}</span><span>${text}</span></div>`).join('')}</div>
            ${statusLine()}
          </section>
          <aside class="run-queue">
            <div class="panel-title">RUN QUEUE <span class="count">${selectedCount()}</span></div>
            ${targets.slice(1, 8).map((target, index) => `<div class="queue-item ${state.cursor === index + 1 ? 'cursor' : ''}" data-row="${index + 1}"><div class="queue-name"><span>${target.selected ? '[x]' : '[ ]'} ${target.name}</span><span class="status ${target.status}">${target.label}</span></div><div class="queue-meta">${target.time === '—' ? 'waiting for slot' : target.time + ' · logs available'}</div></div>`).join('')}
          </aside>
        </div>
        ${commandLine()}
        ${footer('logs')}
        ${overlay()}
      </section>`;
    }

    function VariantC() {
      return `<section class="terminal variant-c">
        ${topLine('<span class="meta">TABLE MODE</span>')}
        ${commandLine()}
        <section class="table-stage">
          <div class="table-head"><span>SEL</span><span>DIRECTORY ▲</span><span>STATUS</span><span class="right hide-60">ELAPSED</span><span class="right hide-80 hide-60">LINES</span><span class="right hide-80 hide-60">EXIT</span></div>
          <div class="rows">${targets.slice(1).map((target, rawIndex) => {
            const index = rawIndex + 1;
            return `<div class="table-row ${state.cursor === index ? 'cursor' : ''}" data-row="${index}"><span>${target.selected ? '[x]' : '[ ]'}</span><span>${target.name}</span><span class="status ${target.status}">${target.label}</span><span class="right hide-60">${target.time}</span><span class="right hide-80 hide-60">${target.status === 'idle' ? '0' : 9 + index * 7}</span><span class="right hide-80 hide-60">${target.status === 'fail' ? '1' : target.status === 'ok' ? '0' : '—'}</span></div>`;
          }).join('')}</div>
        </section>
        <section class="drawer">
          <div class="panel-title">OUTPUT DRAWER — ${currentTarget().name}<span class="status ${currentTarget().status}">[${currentTarget().label}]</span><span class="count">press Enter to expand · f follow</span></div>
          <div class="log-lines">${logLines()}</div>
        </section>
        ${footer('tasks')}
        ${overlay()}
      </section>`;
    }

    function overlay() {
      if (!state.modal) return '';
      if (state.modal === 'cancel') return `<div class="modal-backdrop"><section class="modal"><h2>Cancel ${selectedCount()} selected targets?</h2><p>1 running · 2 queued. Completed targets remain unchanged.</p><p><strong>Scope:</strong> api, web, worker, packages, ui, billing-fail…</p><div class="modal-actions"><button data-close>Esc · Back</button><button class="danger" data-confirm>Enter · Cancel ${selectedCount()}</button></div></section></div>`;
      if (state.modal === 'help') return `<div class="modal-backdrop"><section class="modal"><h2 style="color:var(--accent)">Context help — ${state.focus}</h2><div class="help-grid"><kbd>j/k</kbd><span>move cursor</span><kbd>space</kbd><span>select</span><kbd>tab</kbd><span>switch pane</span><kbd>x</kbd><span>cancel scope</span><kbd>f</kbd><span>toggle follow</span><kbd>q</kbd><span>quit safely</span><kbd>←/→</kbd><span>prototype variant</span><kbd>esc</kbd><span>close</span></div><div class="modal-actions"><button data-close>Esc · Close</button></div></section></div>`;
      return `<div class="modal-backdrop"><section class="modal"><h2 style="color:var(--accent)">Command palette</h2><p>› cancel selected <span class="status fail">DANGER · ${selectedCount()} targets</span></p><p>  rerun failed <span class="meta">R</span></p><p>  workers 4 <span class="meta">current</span></p><p>  open full log</p><div class="modal-actions"><button data-close>Esc · Close</button></div></section></div>`;
    }

    function render() {
      if (!variants.some(variant => variant.key === state.variant)) state.variant = 'A';
      const stage = document.querySelector('#stage');
      stage.dataset.size = state.size;
      stage.classList.toggle('mono', state.mono);
      stage.innerHTML = state.variant === 'A' ? VariantA() : state.variant === 'B' ? VariantB() : VariantC();

      const current = variants.find(variant => variant.key === state.variant);
      document.querySelector('#variant-title').innerHTML = `<strong>${current.key}</strong> — ${current.name}`;
      document.querySelector('#state-readout').textContent = `focus:${state.focus} · cursor:${currentTarget().name} · selected:${selectedCount()} · follow:${state.follow ? 'on' : 'off'}`;
      document.querySelectorAll('[data-size]').forEach(button => button.classList.toggle('active', button.dataset.size === state.size));
      document.querySelector('#mono').classList.toggle('active', state.mono);

      document.querySelectorAll('[data-row]').forEach(row => row.addEventListener('click', event => {
        state.cursor = Number(row.dataset.row);
        if (event.target.closest('.check') || event.target.closest('.table-row')) targets[state.cursor].selected = !targets[state.cursor].selected;
        render();
      }));
      document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => { state.modal = null; render(); }));
      document.querySelectorAll('[data-confirm]').forEach(button => button.addEventListener('click', () => { state.modal = null; targets.forEach(target => { if (target.selected && ['run', 'queue'].includes(target.status)) { target.status = 'idle'; target.label = 'CANCEL'; } }); render(); }));
      updateURL();
    }

    function cycleVariant(delta) {
      const index = variants.findIndex(variant => variant.key === state.variant);
      state.variant = variants[(index + delta + variants.length) % variants.length].key;
      state.modal = null;
      render();
    }

    document.querySelector('#previous').addEventListener('click', () => cycleVariant(-1));
    document.querySelector('#next').addEventListener('click', () => cycleVariant(1));
    document.querySelectorAll('[data-size]').forEach(button => button.addEventListener('click', () => { state.size = button.dataset.size; render(); }));
    document.querySelector('#mono').addEventListener('click', () => { state.mono = !state.mono; render(); });

    document.addEventListener('keydown', event => {
      if (event.target.matches('input, textarea, [contenteditable]')) return;
      if (event.key === 'ArrowLeft') return cycleVariant(-1);
      if (event.key === 'ArrowRight') return cycleVariant(1);
      if (event.key === 'Escape') { state.modal = null; return render(); }
      if (state.modal) return;
      if (event.key === 'j' || event.key === 'ArrowDown') state.cursor = Math.min(targets.length - 1, state.cursor + 1);
      else if (event.key === 'k' || event.key === 'ArrowUp') state.cursor = Math.max(0, state.cursor - 1);
      else if (event.key === ' ') targets[state.cursor].selected = !targets[state.cursor].selected;
      else if (event.key === 'Tab') { event.preventDefault(); state.focus = state.focus === 'tasks' ? 'logs' : 'tasks'; }
      else if (event.key === 'f') state.follow = !state.follow;
      else if (event.key === 'x') state.modal = 'cancel';
      else if (event.key === '?') state.modal = 'help';
      else if (event.key === ':') state.modal = 'palette';
      else return;
      event.preventDefault();
      render();
    });

    render();
  </script>
</body>
</html>
